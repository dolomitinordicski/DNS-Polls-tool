name: Deploy DNS Polls Firestore rules (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: 'Type dns-polls to confirm the target project'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dns-polls-rules
  cancel-in-progress: false

jobs:
  rules:
    if: github.ref == 'refs/heads/main' && inputs.confirm_project == 'dns-polls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test and Firebase CLI dependencies
        run: npm install --prefix tests/firestore --no-package-lock
      - name: Check permissions in Firestore Emulator
        run: >
          ./tests/firestore/node_modules/.bin/firebase emulators:exec
          --config firebase.emulator.json --project demo-dns-polls
          --only firestore "node --test tests/firestore/events.rules.test.mjs"
      - name: Authenticate with DNS Polls service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_POLLS }}
      - name: Deploy rules only to dns-polls
        run: >
          ./tests/firestore/node_modules/.bin/firebase deploy
          --config firebase.json --only firestore:rules
          --project dns-polls --non-interactive

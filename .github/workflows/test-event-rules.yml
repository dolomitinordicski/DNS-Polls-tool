name: Validate event registration permissions

on:
  pull_request:
    paths:
      - firestore.rules
      - firebase.emulator.json
      - tests/firestore/**
      - .github/workflows/test-event-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test dependencies
        run: npm install --prefix tests/firestore --no-package-lock
      - name: Run Firestore rules tests
        run: >
          ./tests/firestore/node_modules/.bin/firebase emulators:exec
          --config firebase.emulator.json --project demo-dns-polls
          --only firestore "node --test tests/firestore/events.rules.test.mjs"
